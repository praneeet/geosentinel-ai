services:
  postgres:
    image: postgres:15-alpine
    container_name: geosentinel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-geosentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-geosentinel_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-geosentinel_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-geosentinel} -d ${POSTGRES_DB:-geosentinel_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: geosentinel-backend
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
      - ./data:/data
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-geosentinel}:${POSTGRES_PASSWORD:-geosentinel_secure_pass}@postgres:5432/${POSTGRES_DB:-geosentinel_db}
      - ENABLE_IN_APP_SCHEDULER=true
      - DEMO_MODE=${DEMO_MODE:-true}
      - NEWSAPI_KEY=${NEWSAPI_KEY:-}
      - MEDIASTACK_KEY=${MEDIASTACK_KEY:-}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - WEBHOOKS_ENABLED=${WEBHOOKS_ENABLED:-false}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: geosentinel-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000/api
      - VITE_WS_URL=ws://localhost:8000/ws/alerts
    depends_on:
      - backend

volumes:
  postgres_data:
