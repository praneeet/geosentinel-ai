services:
  postgres:
    image: postgres:15-alpine
    container_name: geosentinel-prod-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-geosentinel_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set strong POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-geosentinel_production}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-geosentinel_admin} -d ${POSTGRES_DB:-geosentinel_production}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M

  redis:
    image: redis:7-alpine
    container_name: geosentinel-prod-redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: geosentinel-prod-api
    restart: always
    environment:
      - ENVIRONMENT=production
      - DEBUG=False
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-geosentinel_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-geosentinel_production}
      - REDIS_URL=redis://redis:6379/0
      - ENABLE_IN_APP_SCHEDULER=false
      - DEMO_MODE=False
      - RUN_MIGRATIONS=true
      - ADMIN_API_KEY=${ADMIN_API_KEY:?Set strong ADMIN_API_KEY in .env}
      - SECRET_KEY=${SECRET_KEY:?Set strong SECRET_KEY in .env}
      - NEWSAPI_KEY=${NEWSAPI_KEY:-}
      - MEDIASTACK_KEY=${MEDIASTACK_KEY:-}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - WEBHOOKS_ENABLED=${WEBHOOKS_ENABLED:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: geosentinel-prod-worker
    restart: always
    command: ["python", "-m", "app.worker"]
    environment:
      - ENVIRONMENT=production
      - DEBUG=False
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-geosentinel_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-geosentinel_production}
      - REDIS_URL=redis://redis:6379/0
      - ENABLE_IN_APP_SCHEDULER=false
      - DEMO_MODE=False
      - RUN_MIGRATIONS=false
      - SECRET_KEY=${SECRET_KEY:?Set strong SECRET_KEY in .env}
      - NEWSAPI_KEY=${NEWSAPI_KEY:-}
      - MEDIASTACK_KEY=${MEDIASTACK_KEY:-}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - WEBHOOKS_ENABLED=${WEBHOOKS_ENABLED:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: geosentinel-prod-ui
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

volumes:
  postgres_prod_data:
