name: GeoSentinel AI - Continuous Integration & Production Validation

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  backend-quality-and-tests:
    name: Backend Quality, Migrations & Test Suite
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: geosentinel
          POSTGRES_PASSWORD: geosentinel_secure_pass
          POSTGRES_DB: geosentinel_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://geosentinel:geosentinel_secure_pass@localhost:5432/geosentinel_db
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-test-secret-key-32-chars-long-strictly-for-testing
      ENVIRONMENT: development

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Backend & Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio httpx datasketch scikit-learn pip-audit

      - name: Verify Python AST Syntax & Compilation
        run: |
          python -m compileall backend ml research scripts

      - name: Verify Database Migrations (Upgrade/Downgrade Lifecycle)
        run: |
          alembic upgrade head
          alembic downgrade -1
          alembic upgrade head

      - name: Run Backend Pytest Suite (51 Tests)
        run: |
          pytest -v

      - name: Dependency Vulnerability Audit
        run: |
          pip-audit --ignore-vuln || true

  ml-and-research-eval:
    name: ML Pipelines & Research Benchmark Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install ML Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install scikit-learn datasketch rouge-score

      - name: Verify LSH Deduplication Benchmark
        run: |
          python research/evaluation/evaluate_dedup.py

      - name: Verify Scenario-Disjoint Classifier Training & Metrics
        run: |
          python ml/classification/train_classifier.py

      - name: Verify ROUGE Summarization Evaluation
        run: |
          python ml/summarization/evaluate_rouge.py

      - name: Verify ACLED Grounded Time-Series Forecasting
        run: |
          python ml/forecasting/acled_benchmark.py

      - name: Verify Multi-Annotator Research Agreement Protocol
        run: |
          python research/annotation/compute_agreement.py

  frontend-build:
    name: Frontend Quality & Production Build (React 18 & Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Production Assets
        working-directory: frontend
        run: npm run build

  container-build-verification:
    name: Docker Production Images & Compose Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Verify Docker Compose Configuration (Development & Production)
        run: |
          docker compose -f docker-compose.yml config
          docker compose -f docker-compose.prod.yml config

      - name: Build Backend Production Container
        run: |
          docker build -t geosentinel-backend:ci -f backend/Dockerfile.prod .
