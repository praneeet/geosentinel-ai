name: GeoSentinel AI - Continuous Integration

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  backend-tests:
    name: Backend Test Suite (FastAPI & Pytest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio httpx datasketch scikit-learn

      - name: Run Backend Pytest Suite
        run: |
          pytest -v

      - name: Verify Research & ML Evaluation Pipelines
        run: |
          python research/evaluation/evaluate_dedup.py
          python ml/classification/train_classifier.py
          python ml/summarization/evaluate_rouge.py
          python ml/forecasting/acled_benchmark.py

  frontend-build:
    name: Frontend Build & Asset Verification (React 18 & Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Production Assets
        working-directory: frontend
        run: npm run build
